predicates:
  - key: broader
    description: 대상이 주어보다 더 넓은 개념이다.
  - key: narrower
    description: 대상이 주어보다 더 좁은 개념이다.
  - key: prerequisite_for
    description: 주어를 이해하거나 수행하는 데 대상이 선행 조건이다.
  - key: enables
    description: 주어가 대상의 가능성을 만든다.
  - key: constrains
    description: 주어가 대상의 범위나 형태를 제한한다.
  - key: measures
    description: 주어가 대상의 성질이나 결과를 측정한다.
  - key: implements
    description: 주어가 대상의 설계나 명세를 구현한다.
  - key: exemplifies
    description: 주어가 대상의 구체적 사례다.
  - key: precedes
    description: 주어가 대상보다 시간적으로 앞선다.
  - key: responds_to
    description: 주어가 대상의 문제나 한계에 대응한다.
  - key: contradicts
    description: 주어가 대상과 양립하지 않는다.
  - key: synthesizes
    description: 주어가 여러 대상을 종합한다.
