  <text x="60" y="830" class="caption">그림 2. 활용률에 따른 서버 전력 사용량과 상대 에너지 효율.</text>
  <text x="60" y="855" class="note">원문 Figure 2의 축·곡선·주 운용 구간을 기준으로 재작성했으며, 논문은 원자료의 개별 관측값을 제공하지 않는다.</text>
