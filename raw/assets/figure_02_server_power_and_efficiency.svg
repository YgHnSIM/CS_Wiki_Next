      .axis-title { fill: #243b53; font: 700 18px "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .tick { fill: #486581; font: 500 15px "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .focus-label { fill: #0f766e; font: 800 16px "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .callout-title { fill: #102a43; font: 800 16px "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
