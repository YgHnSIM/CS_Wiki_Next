<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="title desc">
  <title id="title">그림 2 재작성: 활용률에 따른 서버 전력 사용량과 상대 효율</title>
  <desc id="desc">대표적인 에너지 효율형 서버의 정규화된 전력 곡선과 상대 효율 곡선. 유휴에 가까운 상태에서도 전력은 최대치의 약 50퍼센트이며, 20에서 30퍼센트 활용률에서는 상대 효율이 최대 부하의 절반 미만이다.</desc>

