  <rect x="50" y="730" width="1100" height="58" rx="16" fill="#102a43"/>
  <rect x="70" y="746" width="90" height="26" rx="13" fill="#e85d5d"/>
  <text x="115" y="764" class="insight-label" text-anchor="middle">핵심 관찰</text>
