<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5px; }
      
      .box-e1 { fill: #fdf4ff; stroke: #f5d0fe; stroke-width: 1.5px; }
      .box-e2 { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5px; }
      .box-e3 { fill: #fff1f2; stroke: #fecdd3; stroke-width: 1.5px; }
      .box-e4 { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.5px; }

      .card-inner { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1px; }
      .card-highlight { fill: #ffffff; stroke: #86efac; stroke-width: 1.5px; }

      .badge-e1 { fill: #a855f7; }
      .badge-e2 { fill: #2563eb; }
      .badge-e3 { fill: #e11d48; }
      .badge-e4 { fill: #16a34a; }

      .badge-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 11px; font-weight: 700; }
      .sec-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 13.5px; font-weight: 700; }
      .card-title { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 12.5px; font-weight: 700; }
      .card-desc { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 11px; font-weight: 400; }

      .arrow-main { stroke: #64748b; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .arrow-accent { stroke: #059669; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .arrow-head { fill: #64748b; }
      .arrow-head-accent { fill: #059669; }
      .arrow-label { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 10.5px; font-weight: 600; text-anchor: middle; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #090d16; stroke: #1e293b; }
        
        .box-e1 { fill: #1b1124; stroke: #4a1d6d; }
        .box-e2 { fill: #101a2e; stroke: #1e3a5f; }
        .box-e3 { fill: #1f1215; stroke: #541c26; }
        .box-e4 { fill: #0c1f17; stroke: #14532d; }

        .card-inner { fill: #121826; stroke: #1e293b; }
        .card-highlight { fill: #13231b; stroke: #166534; }

        .badge-e1 { fill: #c084fc; }
        .badge-e2 { fill: #60a5fa; }
        .badge-e3 { fill: #fb7185; }
        .badge-e4 { fill: #4ade80; }

        .badge-text { fill: #0f172a; }
        .sec-title { fill: #f8fafc; }
        .card-title { fill: #e2e8f0; }
        .card-desc { fill: #94a3b8; }

        .arrow-main { stroke: #94a3b8; }
        .arrow-accent { stroke: #4ade80; }
        .arrow-head { fill: #94a3b8; }
        .arrow-head-accent { fill: #4ade80; }
        .arrow-label { fill: #cbd5e1; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
    <marker id="arrow-acc" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head-accent" />
    </marker>
  </defs>

  <!-- Outer Background Canvas -->
  <rect width="900" height="680" rx="12" class="bg"/>

  <!-- ================= 1단계: 19세기 기계식 ================= -->
  <rect x="24" y="20" width="852" height="115" rx="8" class="box-e1"/>
  <rect x="36" y="30" width="32" height="18" rx="4" class="badge-e1"/>
  <text x="52" y="43" text-anchor="middle" class="badge-text">01</text>
  <text x="76" y="44" class="sec-title">19세기 기계식: 계산 자동화에서 기호 제어로</text>

  <!-- E1 Left: 차분 기관 -->
  <rect x="36" y="56" width="370" height="68" rx="6" class="card-inner"/>
  <text x="48" y="76" class="card-title">차분 기관 (Difference Engine)</text>
  <text x="48" y="94" class="card-desc">• 유한 차분법 고정 기어로 수학 표 계산 자동화</text>
  <text x="48" y="110" class="card-desc">• 특수 목적 수치 연산기의 역사적 원형</text>

  <!-- E1 Mid Arrow -->
  <path d="M 414 90 L 476 90" class="arrow-main" marker-end="url(#arrow)"/>
  <text x="445" y="82" class="arrow-label">기호 제어 필요</text>

  <!-- E1 Right: 해석 기관 -->
  <rect x="484" y="56" width="380" height="68" rx="6" class="card-inner"/>
  <text x="496" y="76" class="card-title">해석 기관 (Analytical Engine)</text>
  <text x="496" y="94" class="card-desc">• Mill(연산) - Store(저장) 분리 &amp; 천공 카드 제어</text>
  <text x="496" y="110" class="card-desc">• 수치를 넘어 대수적 기호 패턴을 직조하는 범용 기계</text>

  <!-- Transition 1 -> 2 -->
  <path d="M 450 135 L 450 162" class="arrow-main" marker-end="url(#arrow)"/>
  <text x="560" y="152" class="arrow-label">전자식 메모리 적재 실현</text>


  <!-- ================= 2단계: 20세기 전자식 ================= -->
  <rect x="24" y="166" width="852" height="98" rx="8" class="box-e2"/>
  <rect x="36" y="176" width="32" height="18" rx="4" class="badge-e2"/>
  <text x="52" y="189" text-anchor="middle" class="badge-text">02</text>
  <text x="76" y="190" class="sec-title">20세기 전자식: 저장 프로그램 컴퓨터와 범용 CPU 패권</text>

  <!-- E2 Center Card -->
  <rect x="36" y="202" width="828" height="52" rx="6" class="card-inner"/>
  <text x="48" y="222" class="card-title">EDSAC / EDVAC &amp; 폰 노이만 구조 (Stored-Program Computer)</text>
  <text x="48" y="240" class="card-desc">• 메모리에 저장된 명령어로 임의 절차 실행, 서브루틴·OS 소프트웨어 스택 확립</text>
  <text x="580" y="240" class="card-desc" style="font-weight:600;">→ 무어의 법칙 전성기: 단일 범용 CPU가 모든 연산 주도</text>

  <!-- Transition 2 -> 3 -->
  <path d="M 450 264 L 450 291" class="arrow-main" marker-end="url(#arrow)"/>
  <text x="575" y="281" class="arrow-label">무어의 법칙 둔화 · 전력 장벽 돌파</text>


  <!-- ================= 3단계: 2010s 특화 가속기 ================= -->
  <rect x="24" y="295" width="852" height="115" rx="8" class="box-e3"/>
  <rect x="36" y="305" width="32" height="18" rx="4" class="badge-e3"/>
  <text x="52" y="318" text-anchor="middle" class="badge-text">03</text>
  <text x="76" y="319" class="sec-title">2010s 특화 가속기: 도메인 특화 아키텍처(DSA)와 수치 연산 극대화</text>

  <!-- E3 Left: TPU / ASIC -->
  <rect x="36" y="331" width="370" height="68" rx="6" class="card-inner"/>
  <text x="48" y="351" class="card-title">Google TPU / AI ASIC</text>
  <text x="48" y="369" class="card-desc">• 시스톨릭 어레이 기반 GEMM 텐서 연산 극대화</text>
  <text x="48" y="385" class="card-desc">• 범용 제어 로직 제거로 극상의 전력 효율(TOPS/W) 달성</text>

  <!-- E3 Mid Arrow -->
  <path d="M 414 365 L 476 365" class="arrow-main" marker-end="url(#arrow)"/>
  <text x="445" y="357" class="arrow-label">초저지연 극단화</text>

  <!-- E3 Right: Groq LPU -->
  <rect x="484" y="331" width="380" height="68" rx="6" class="card-inner"/>
  <text x="496" y="351" class="card-title">Groq LPU (Language Processing Unit)</text>
  <text x="496" y="369" class="card-desc">• 온칩 대규모 SRAM &amp; 정적 컴파일러 스케줄링</text>
  <text x="496" y="385" class="card-desc">• 지터(Jitter) 0의 결정론적 단일 토큰 디코드 가속</text>

  <!-- Transition 3 -> 4 -->
  <path d="M 450 410 L 450 437" class="arrow-accent" marker-end="url(#arrow-acc)"/>
  <text x="595" y="427" class="arrow-label" style="fill:#059669; font-weight:700;">에이전틱 제어 · 도구 호출 · 상태 스케줄링 복잡성 증대</text>


  <!-- ================= 4단계: 2020s+ 에이전틱 & 이종 수렴 ================= -->
  <rect x="24" y="441" width="852" height="218" rx="8" class="box-e4"/>
  <rect x="36" y="451" width="32" height="18" rx="4" class="badge-e4"/>
  <text x="52" y="464" text-anchor="middle" class="badge-text">04</text>
  <text x="76" y="465" class="sec-title">2020s+ 에이전틱 AI &amp; 이종 시스템 수렴 (Heterogeneous Convergence)</text>

  <!-- E4 Top Left: Host CPU -->
  <rect x="36" y="477" width="395" height="74" rx="6" class="card-inner"/>
  <text x="48" y="497" class="card-title">고밀도 호스트 CPU (AMD EPYC / Grace)</text>
  <text x="48" y="515" class="card-desc">• 비선형 제어, MCTS 트리 탐색, 조건 분기 오케스트레이션</text>
  <text x="48" y="531" class="card-desc">• 도구 호출(Tool/API), RAG 검색, 동적 KV 캐시 페이징 총괄</text>

  <!-- E4 Top Right: Tensor Accelerators -->
  <rect x="449" y="477" width="415" height="74" rx="6" class="card-inner"/>
  <text x="461" y="497" class="card-title">병렬 가속기 &amp; ASIC (NVIDIA Blackwell / TPU / LPU)</text>
  <text x="461" y="515" class="card-desc">• 대규모 Dense/MoE 행렬 연산(GEMM) 고속 처리</text>
  <text x="461" y="531" class="card-desc">• SIMT/CUDA 생태계를 통한 알고리즘 불확실성 헤징</text>

  <!-- E4 Bottom Unified Heterogeneous Bar -->
  <rect x="36" y="561" width="828" height="86" rx="6" class="card-highlight"/>
  <text x="48" y="583" class="card-title" style="fill:#15803d; font-size:13px;">★ 이종 실행 모델 (Heterogeneous Execution Model) 로의 안착</text>
  <text x="48" y="603" class="card-desc" style="font-size:11.5px; font-weight:500;">
    "수치 연산 가속은 특화 연산기(계산기)가 맡고, 시스템 기호 조작과 제어 흐름은 범용 컴퓨터(CPU)가 지휘한다."
  </text>
  <text x="48" y="623" class="card-desc">
    → NVLink-C2C, PCIe Gen6, CXL 하드웨어 일관성 버스로 통합 주소 공간을 묶어 연산과 제어의 완전한 분업 실현
  </text>
</svg>