<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="title desc">
  <title id="title">그림 4 재작성: 에너지 비례 서버의 전력 사용량과 상대 효율</title>
  <desc id="desc">유휴 전력을 최대치의 10퍼센트로 낮춘 에너지 비례 서버의 정규화된 전력 곡선과 상대 효율 곡선. 상대 효율은 10퍼센트 활용률에서 50퍼센트를 넘고 30퍼센트 이상에서 80퍼센트를 넘는다.</desc>

  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .card { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; }
      .ink { fill: #102a43; }
      .muted { fill: #627d98; }
      .coral { fill: #e85d5d; }
      .teal { fill: #0f8b8d; }
      .grid { stroke: #d9e2ec; stroke-width: 1; }
      .grid.vertical { stroke: #e8eef4; stroke-dasharray: 2 8; }
      .axis { stroke: #243b53; stroke-width: 2.2; stroke-linecap: round; }
      .tick-mark { stroke: #829ab1; stroke-width: 1.2; }
      .power { fill: none; stroke: #0f8b8d; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .efficiency { fill: none; stroke: #e85d5d; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .threshold { fill: none; stroke: #f2a3a3; stroke-width: 1.4; stroke-dasharray: 6 6; }
      .kicker { fill: #e85d5d; font: 700 15px "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; letter-spacing: 2px; }
      .title { fill: #102a43; font: 800 35px "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .subtitle { fill: #486581; font: 500 17px "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .meta { fill: #0f8b8d; font: 700 14px "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .axis-title { fill: #243b53; font: 700 18px "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .tick { fill: #486581; font: 500 15px "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .focus-label { fill: #0f766e; font: 800 16px "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .callout-title { fill: #102a43; font: 800 16px "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .callout-body { fill: #486581; font: 500 14px "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .insight-label { fill: #ffffff; font: 800 14px "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; letter-spacing: 1px; }
      .insight { fill: #ffffff; font: 700 18px "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
