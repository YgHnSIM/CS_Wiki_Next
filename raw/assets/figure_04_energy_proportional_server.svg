  <line x1="808.00" y1="560" x2="808.00" y2="569" class="tick-mark"/>
  <text x="808.00" y="594" class="tick" text-anchor="middle">70</text>
  <line x1="902.00" y1="560" x2="902.00" y2="569" class="tick-mark"/>
  <text x="902.00" y="594" class="tick" text-anchor="middle">80</text>
  <line x1="996.00" y1="560" x2="996.00" y2="569" class="tick-mark"/>
  <text x="996.00" y="594" class="tick" text-anchor="middle">90</text>
  <line x1="1090.00" y1="560" x2="1090.00" y2="569" class="tick-mark"/>
  <text x="1090.00" y="594" class="tick" text-anchor="middle">100</text>
  <text x="132" y="565.00" class="tick" text-anchor="end">0</text>
  <text x="132" y="532.00" class="tick" text-anchor="end">10</text>
  <text x="132" y="499.00" class="tick" text-anchor="end">20</text>
  <text x="132" y="466.00" class="tick" text-anchor="end">30</text>
  <text x="132" y="433.00" class="tick" text-anchor="end">40</text>
  <text x="132" y="400.00" class="tick" text-anchor="end">50</text>
  <text x="132" y="367.00" class="tick" text-anchor="end">60</text>
  <text x="132" y="334.00" class="tick" text-anchor="end">70</text>
  <text x="132" y="301.00" class="tick" text-anchor="end">80</text>
  <text x="132" y="268.00" class="tick" text-anchor="end">90</text>
  <text x="132" y="235.00" class="tick" text-anchor="end">100</text>
  <text x="620.00" y="621" class="axis-title" text-anchor="middle">활용률 (%)</text>
  <text x="77" y="395" class="axis-title" text-anchor="middle" transform="rotate(-90 77 395)">서버 전력·상대 효율 (최대치 대비, %)</text>

  <rect x="820" y="438" width="250" height="83" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#b8c7d9" stroke-width="1.5"/>
  <line x1="842" y1="466" x2="883" y2="466" class="power"/>
  <text x="897" y="471" class="legend-text">전력 p(u)</text>
  <line x1="842" y1="495" x2="883" y2="495" class="efficiency"/>
  <text x="897" y="500" class="legend-text">상대 효율 u/p(u)</text>

  <rect x="150" y="646" width="410" height="48" rx="12" fill="#eefcf9" stroke="#a8ded4" stroke-width="1.5"/>
  <circle cx="173" cy="670" r="6" fill="#0f8b8d"/>
  <text x="190" y="667" class="callout-title">동적 전력 범위 90%</text>
  <text x="190" y="686" class="callout-body">유휴 10%에서 최대 부하 100%까지 넓은 범위</text>
  <rect x="580" y="646" width="510" height="48" rx="12" fill="#fff4f4" stroke="#f4b4b4" stroke-width="1.5"/>
  <circle cx="603" cy="670" r="6" fill="#e85d5d"/>
  <text x="620" y="667" class="callout-title">상대 효율의 회복</text>
  <text x="620" y="686" class="callout-body">10% 활용률에서도 50% 이상 · 30% 이상에서 80% 이상</text>

  <rect x="50" y="730" width="1100" height="58" rx="16" fill="#102a43"/>
  <rect x="70" y="746" width="90" height="26" rx="13" fill="#e85d5d"/>
  <text x="115" y="764" class="insight-label" text-anchor="middle">핵심 관찰</text>
  <text x="185" y="766" class="insight">최고 전력을 낮추지 않아도, 유휴 전력을 줄이면 실제 운용 구간의 효율이 올라간다.</text>

  <text x="60" y="830" class="caption">그림 4. 더 에너지 비례적인 서버의 전력 사용량과 상대 에너지 효율.</text>
  <text x="60" y="855" class="note">원문 Figure 4의 90% 동적 전력 범위와 효율 기준을 반영한 재작성 도표이며, 실측 보편값이 아니라 논문의 모형 곡선이다.</text>
</svg>
