      .legend-text { fill: #243b53; font: 600 15px "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }
      .point-label { fill: #243b53; font: 700 14px "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; }

    </style>
    <marker id="figure4-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0f8b8d"/>
    </marker>
    <filter id="figure4-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102a43" flood-opacity="0.08"/>
