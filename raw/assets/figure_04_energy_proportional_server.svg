  <rect width="1200" height="900" class="bg"/>
  <text x="60" y="62" class="kicker">FIGURE 04  /  ENERGY PROPORTIONALITY</text>
  <text x="60" y="107" class="title">유휴 전력을 10%로 낮추면 곡선이 달라진다</text>
  <text x="60" y="139" class="subtitle">The Case for Energy-Proportional Computing · Barroso · Hölzle · 2007</text>
  <rect x="925" y="42" width="215" height="34" rx="17" fill="#e6fffa"/>
  <text x="1032.5" y="64" class="meta" text-anchor="middle">원문 Figure 4 재작성</text>


