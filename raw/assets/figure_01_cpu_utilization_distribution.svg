  <title id="title">그림 1 재구성: 5,000대 이상 서버의 6개월 평균 CPU 활용률 분포</title>
  <desc id="desc">CPU 활용률 0에서 100퍼센트까지의 시간 비율 히스토그램. 10에서 50퍼센트의 중간 부하 구간이 주요 운용 영역이며, 완전 유휴와 최대 활용률은 상대적으로 작은 꼬리로 나타난다.</desc>
