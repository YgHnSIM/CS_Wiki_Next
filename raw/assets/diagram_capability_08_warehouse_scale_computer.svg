<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 165" width="880" height="165">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5px; }
      .card-1 { fill: #fff1f2; stroke: #fecdd3; stroke-width: 1.5px; }
      .card-2 { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5px; }
      .card-3 { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 1.5px; }
      
      .badge-1 { fill: #e11d48; }
      .badge-2 { fill: #2563eb; }
      .badge-3 { fill: #059669; }
      
      .badge-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 11px; font-weight: 700; }
      .title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 14.5px; font-weight: 700; }
      .desc { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 12px; font-weight: 400; }
      .arrow { stroke: #94a3b8; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .arrow-head { fill: #94a3b8; }
      .arrow-label { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 10.5px; font-weight: 600; text-anchor: middle; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #090d16; stroke: #1e293b; }
        .card-1 { fill: #1f1315; stroke: #4c1d24; }
        .card-2 { fill: #111a2e; stroke: #1e3a5f; }
        .card-3 { fill: #0d2019; stroke: #134e38; }
        
        .badge-1 { fill: #fb7185; }
        .badge-2 { fill: #60a5fa; }
        .badge-3 { fill: #34d399; }
        
        .badge-text { fill: #0f172a; }
        .title { fill: #f8fafc; }
        .desc { fill: #94a3b8; }
        .arrow { stroke: #475569; }
        .arrow-head { fill: #475569; }
        .arrow-label { fill: #94a3b8; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Background Container -->
  <rect width="880" height="165" rx="10" class="bg"/>

  <!-- Step 1 Card: 기존 병목 -->
  <rect x="16" y="16" width="248" height="133" rx="8" class="card-1"/>
  <rect x="28" y="28" width="74" height="20" rx="4" class="badge-1"/>
  <text x="65" y="42.5" text-anchor="middle" class="badge-text">기존 병목</text>
  <text x="28" y="72" class="title">단일 노드 한계 &amp; 분산 고장</text>
  <text x="28" y="98" class="desc">서버 수천 대 규모의 컴포넌트 일상 고장</text>
  <text x="28" y="118" class="desc">분산 네트워크 레이턴시 및 통신 병목</text>

  <!-- Arrow 1: 대응 -->
  <path d="M 272 82 L 302 82" class="arrow" marker-end="url(#arrow)"/>
  <text x="287" y="74" class="arrow-label">대응</text>

  <!-- Step 2 Card: 구조적 대응 -->
  <rect x="310" y="16" width="260" height="133" rx="8" class="card-2"/>
  <rect x="322" y="28" width="120" height="20" rx="4" class="badge-2"/>
  <text x="382" y="42.5" text-anchor="middle" class="badge-text">분산 인프라 대응</text>
  <text x="322" y="72" class="title">창고 규모 컴퓨터(WSC) + ROC</text>
  <text x="322" y="98" class="desc">복구 지향 컴퓨팅(빠른 탐지·격리·복구)</text>
  <text x="322" y="118" class="desc">꼬리 지연 완화(헤지드 요청·선택적 복제)</text>

  <!-- Arrow 2: 전이 -->
  <path d="M 578 82 L 608 82" class="arrow" marker-end="url(#arrow)"/>
  <text x="593" y="74" class="arrow-label">전이</text>

  <!-- Step 3 Card: 새로운 병목 / 지표 -->
  <rect x="616" y="16" width="248" height="133" rx="8" class="card-3"/>
  <rect x="628" y="28" width="143" height="20" rx="4" class="badge-3"/>
  <text x="699.5" y="42.5" text-anchor="middle" class="badge-text">새로운 병목 / 지표</text>
  <text x="628" y="72" class="title">99.9% 꼬리 지연 &amp; 공통 원인 장애</text>
  <text x="628" y="98" class="desc">대규모 팬아웃 시 꼬리 지연 폭발</text>
  <text x="628" y="118" class="desc">분산 합의 오버헤드 및 복구 가용성</text>
</svg>
